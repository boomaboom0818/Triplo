name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m poker.train --hands 10 --output /tmp/smoke.json
      - run: python -m poker.train --hands 20 --resume /tmp/smoke.json --output /tmp/smoke.json
      - run: python -m poker.evaluate --checkpoint /tmp/smoke.json --blocks 2
      - run: python -m poker.train_cfr --game kuhn --iterations 10 --output /tmp/cfr.json
      - run: python -m poker.train_cfr --game kuhn --iterations 20 --resume /tmp/cfr.json --output /tmp/cfr.json
      - run: python -m poker.experiment --output /tmp/staged-cfr --stages 1 2 --blocks 2
